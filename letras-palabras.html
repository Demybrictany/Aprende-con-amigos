<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letras y Palabras A-Z</title>

<link href="https://fonts.cdnfonts.com/css/senturigotin" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="imagenes/favicon.png">

<style>
.modal-feedback {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}
.modal-feedback.mostrar { display: flex; }
.modal-content-feedback {
    background: transparent;
    padding: 0;
    border-radius: 40px;
    text-align: center;
    animation: popIn 0.3s ease;
}
@keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.modal-feedback h2 {
    font-size: 48px;
    margin: 12px 0 0 0;
    color: white;
    text-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
#feedbackImg {
    width: 260px;
    max-width: 70vw;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
    animation: popIn 0.35s ease;
}

/* ===== CAMINO DE ACTIVIDADES ===== */
.camino-container {
    position: relative;
    width: 100%;
    max-width: 860px;
    height: calc(100vh - 250px);
    min-height: 650px;
    max-height: 900px;
    margin: 4px auto 0;
    overflow: visible;
}
.camino-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}
.camino-parada {
    position: absolute;
    width: clamp(120px, 16vh, 190px);
    aspect-ratio: 1;
    background: transparent;
    border-radius: 16px;
    box-shadow: none;
    cursor: pointer;
    text-align: center;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 2;
    transition: transform 0.16s, box-shadow 0.16s;
}
.camino-parada:hover { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.28)); }
.camino-parada img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: transparent;
    border-radius: 12px;
}
.camino-label {
    font-size: clamp(11px, 1.8vh, 15px);
    font-weight: bold;
    padding: 6px 4px 7px;
    color: #1b5e20;
    background: white;
    line-height: 1.2;
}
.camino-num {
    position: absolute;
    top: 7px; left: 7px;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: white;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
}
.cp1 { top: 1%;  left: 3%; }
.cp2 { top: 13%; right: 3%; }
.cp3 { top: 26%; left: 3%; }
.cp4 { top: 39%; right: 3%; }
.cp5 { top: 52%; left: 3%; }
.cp6 { top: 65%; right: 3%; }
.cp7 { top: 78%; left: 3%; }
.cp6, .cp7 { width: clamp(165px, 21vh, 260px); }
.cp1:hover, .cp2:hover, .cp3:hover, .cp4:hover, .cp5:hover, .cp6:hover, .cp7:hover { transform: scale(1.08); }
.cp1:active, .cp2:active, .cp3:active, .cp4:active, .cp5:active, .cp6:active, .cp7:active { transform: scale(0.93); }
#nivel h1 { font-size: 30px; margin: 6px 0 2px; }

body {
    margin: 0;
    font-family: Comic Sans MS, Arial;
    text-align: center;
    background: linear-gradient(to bottom,#8fb3e0,#a8d0e6);
    padding-top: 100px;
}
h1 { font-size: 55px; margin: 40px 0; }

.score { font-size: 28px; margin-bottom: 10px; }

.grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 24px;
    padding: 16px;
}

.card {
    background: #eaeaea;
    width: 240px;
    height: 220px;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    font-size: 22px;
}
.card:hover { transform: scale(1.1); background: white; }
.card img { width: 90%; height: 110px; object-fit: contain; margin-bottom: 15px; }

.big-btn {
    width: 220px;
    height: 220px;
    border: none;
    border-radius: 30px;
    margin: 20px;
    cursor: pointer;
    font-size: 38px;
    font-weight: bold;
    color: #e00000;
    background: white;
    font-family: 'Andika', sans-serif;
    text-transform: lowercase;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    transition: 0.3s;
}
.big-btn:hover { transform: scale(1.08); box-shadow: 0 10px 24px rgba(0,0,0,0.22); }

.asociacion-tablero {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
    gap: 18px;
    max-width: 980px;
    margin: 0 auto;
    padding: 10px 18px;
}
.asociacion-columna {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
    align-content: start;
}
.asociacion-card {
    min-height: 112px;
    border: 4px solid transparent;
    border-radius: 18px;
    background: white;
    color: #e00000;
    cursor: pointer;
    font-family: 'Andika', sans-serif;
    font-size: 24px;
    font-weight: bold;
    padding: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.16);
    transition: transform .16s, border-color .16s, opacity .16s;
}
.asociacion-card:hover { transform: scale(1.04); }
.asociacion-card.seleccionada { border-color: #ffbf00; background: #fff7d6; }
.asociacion-card.completada { opacity: .45; cursor: default; transform: none; }
.asociacion-card img {
    width: 100%;
    height: 96px;
    object-fit: contain;
    display: block;
}

@media (max-width: 700px) {
    .asociacion-tablero { grid-template-columns: 1fr; gap: 10px; }
    .asociacion-columna { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    .asociacion-card { min-height: 88px; font-size: 18px; }
    .asociacion-card img { height: 76px; }
}

.asociacion-imagen-card {
    background: transparent;
    box-shadow: none;
    min-height: 150px;
    padding: 0;
}
.asociacion-imagen-card img {
    height: 145px;
    width: 100%;
    object-fit: contain;
    background: transparent;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
}
.asociacion-imagen-card.seleccionada {
    background: transparent;
    border-color: #ffbf00;
}
@media (max-width: 700px) {
    .asociacion-imagen-card { min-height: 120px; }
    .asociacion-imagen-card img { height: 116px; }
}
.section { display: none; }

.back {
    margin: 30px;
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 20px;
    background: #ff6b6b;
    color: white;
    cursor: pointer;
}

.logo-esquina { position: fixed; top: 10px; z-index: 1000; }
.logo-esquina img { height: 12vw; max-height: 180px; }
.logo-esquina.izquierda { left: 10px; }
.logo-esquina.derecha { right: 10px; }

@media (max-width: 480px){
    h1 { font-size: 7vw; margin: 3vw 0 1.5vw 0; }
    .score { font-size: 5vw; margin-bottom: 4px; }
    .grid { gap: 12px; padding: 10px; }
    .card { width: 40vw; height: 40vw; font-size: 4vw; }
    .card img { width: 90%; height: 20vw; object-fit: contain; }
    .big-btn { width: 34vw; height: 34vw; font-size: 4vw; margin: 5px; }
    .back { font-size: 4vw; padding: 2.5vw 5vw; margin: 10px; }
    .logo-esquina img { height: 15vw; }
}
@media (min-width: 481px) and (max-width: 1024px){
    h1 { font-size: 6vw; margin: 4vw 0 2vw 0; }
    .score { font-size: 3.5vw; }
    .grid { gap: 20px; padding: 16px; }
    .card { width: 30vw; height: 30vw; font-size: 3vw; }
    .card img { width: 90%; height: 16vw; object-fit: contain; }
    .big-btn { width: 28vw; height: 28vw; font-size: 3vw; margin: 8px; }
    .back { font-size: 3vw; padding: 2vw 4vw; }
    .logo-esquina img { height: 13vw; }
}

.modulo-banda {
    display: flex;
    align-items: center;
    border-radius: 60px;
    padding: 14px 30px;
    margin: 9px auto;
    max-width: 540px;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,0.22);
    transition: transform 0.18s, box-shadow 0.18s;
    color: white;
    font-weight: bold;
    position: relative;
    z-index: 2;
    text-decoration: none;
}
.modulo-banda:hover { transform: scale(1.05) translateX(6px); box-shadow: 0 10px 28px rgba(0,0,0,0.3); }
.banda-emoji { font-size: clamp(26px,5vw,36px); margin-right: 14px; flex-shrink: 0; }
.banda-nombre { font-size: clamp(19px,4vw,26px); flex: 1; text-align: left; text-shadow: 0 2px 4px rgba(0,0,0,0.25); }
.banda-deco { font-size: clamp(16px,3vw,22px); opacity: 0.9; flex-shrink: 0; }

.mascota-lado { display: none; pointer-events: none; position: fixed; z-index: 1; }
@media (min-width: 900px){
    .mascota-lado { display: block; font-size: 90px; bottom: 60px; }
    .mascota-izq  { left: 10px;  animation: bounce-slow 3s ease-in-out infinite; }
    .mascota-der  { right: 10px; animation: sway-slow 2.5s ease-in-out infinite; }
}
@media (min-width: 1200px){ .mascota-lado { font-size: 120px; } }

.letra-arco { display: inline-block; animation: letra-baile 1.8s ease-in-out infinite; }
.letra-arco:nth-child(2){animation-delay:.12s}
.letra-arco:nth-child(3){animation-delay:.24s}
.letra-arco:nth-child(4){animation-delay:.36s}
.letra-arco:nth-child(5){animation-delay:.48s}
.letra-arco:nth-child(6){animation-delay:.60s}
.letra-arco:nth-child(7){animation-delay:.72s}
.letra-arco:nth-child(8){animation-delay:.84s}
.letra-arco:nth-child(9){animation-delay:.96s}
.letra-arco:nth-child(10){animation-delay:1.08s}

@keyframes bounce-slow {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}
@keyframes sway-slow {
    0%,100%{transform:rotate(-8deg) translateY(0)}
    50%{transform:rotate(8deg) translateY(-8px)}
}
@keyframes letra-baile {
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-6px) rotate(-4deg)}
    75%{transform:translateY(3px) rotate(4deg)}
}

@media (max-width:480px){
    .modulo-banda{padding:11px 18px;border-radius:40px;margin:7px auto;}
    .banda-nombre{font-size:clamp(15px,4.5vw,19px);}
}

/* === CONTROL DE VOLUMEN === */
#control-volumen {
    position: fixed; bottom: 18px; right: 18px;
    z-index: 10000; display: flex; flex-direction: column;
    align-items: center; gap: 6px;
}
#btn-volumen {
    width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid #FF9100; background: rgba(255,255,255,0.95);
    font-size: 26px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    transition: transform 0.15s, background 0.15s;
    line-height: 1; display: flex; align-items: center; justify-content: center;
}
#btn-volumen:hover { transform: scale(1.12); background: white; }
#panel-volumen {
    display: none; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.97); border-radius: 22px;
    padding: 12px 10px 8px; box-shadow: 0 4px 18px rgba(0,0,0,0.22);
    gap: 5px; border: 2px solid #FF9100;
}
#panel-volumen.abierto { display: flex; }
#slider-vol {
    writing-mode: vertical-lr; direction: rtl;
    width: 6px; height: 85px; cursor: pointer; accent-color: #FF9100;
}
.vol-label { font-size: 11px; color: #888; font-family: Arial, sans-serif; font-weight: bold; }
@media (max-width: 480px) {
    #control-volumen { bottom: 12px; right: 10px; }
    #btn-volumen { width: 46px; height: 46px; font-size: 22px; }
    #slider-vol { height: 70px; }
}

/* === BOTÓN HOME GLOBAL === */
#btn-home-global {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 10000;
}
#btn-home-global button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 3px solid #FF5252;
    background: rgba(255,255,255,0.95);
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    transition: transform 0.15s, background 0.15s;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
#btn-home-global button:hover { transform: scale(1.12); background: white; }
@media (max-width: 480px) {
    #btn-home-global { bottom: 12px; left: 10px; }
    #btn-home-global button { width: 46px; height: 46px; font-size: 22px; }
}

/* === FONDO DE MÓDULOS === */
#fondo-modulos {
    display: none; position: fixed; inset: 0; z-index: -1;
    background: url('imagenes/Fondo.png') no-repeat center center / cover;
}
@media (min-width: 768px) {
    #fondo-modulos { background-image: url('imagenes/Fondo2.png'); }
}
</style>
</head>

<body>
<div id="fondo-modulos"></div>

<audio id="musica-fondo" src="audios/Sonido Pagina.mp3" loop preload="auto"></audio>

<div id="modalFeedback" class="modal-feedback">
    <div class="modal-content-feedback">
        <img id="feedbackImg" src="" alt="">
        <h2 id="feedbackText"></h2>
    </div>
</div>

<div class="logo-esquina izquierda" id="logo-izq" style="display:none">
    <img src="imagenes/logo_umes.png" alt="Logo UMES">
</div>
<div class="logo-esquina derecha" id="logo-der" style="display:none">
    <img src="imagenes/logo_mineduc.png" alt="Logo Ministerio de Educación">
</div>

<div id="nivel" class="section"></div>

<div id="actividad" class="section">
    <div id="contenido"></div>
    <div style="padding:0 16px;max-width:540px;margin:10px auto;">
        <div class="modulo-banda" style="background:#FF9100;" onclick="volverNivel()">
            <span class="banda-emoji">↩️</span>
            <span class="banda-nombre">Volver</span>
            <span class="banda-deco">←</span>
        </div>
    </div>
</div>

<!-- Módulo Palabras A-Z -->
<div id="palabrasAZ" class="section">
    <h1>🔤 Palabras de la A a la Z</h1>
    <div id="contenedor-letras" class="grid"></div>
    <div id="contenedor-palabra-az" style="margin-top:30px;"></div>
</div>

<!-- Botón Home global (esquina inferior izquierda) -->
<div id="btn-home-global">
    <button onclick="window.location.href='index.html'" title="Pantalla principal">🏠</button>
</div>

<!-- Control de volumen flotante -->
<div id="control-volumen">
    <div id="panel-volumen">
        <span class="vol-label" id="vol-pct">45%</span>
        <input type="range" id="slider-vol" min="0" max="100" step="5" value="45"
               oninput="cambiarVolumen(this.value)">
        <span class="vol-label">🔇</span>
    </div>
    <button id="btn-volumen" onclick="togglePanelVol()" title="Volumen">🔊</button>
</div>

<script>

/* ─── Utilidades ─── */
function mezclar(arr){ return arr.sort(()=>Math.random()-0.5); }

/* ─── Camino de actividades ─── */
const _caminoPath = 'M 50 0 C 50 4,10 6,10 11 C 10 17,90 18,90 24 C 90 30,10 31,10 37 C 10 43,90 44,90 50 C 90 56,10 57,10 63 C 10 69,90 70,90 76 C 90 83,10 84,10 91 L 10 100';
const _caminoImgs = ['Asociación.png','Selección.png','Clasificación.png','Denominación.png','Generalización.png','ComprensionLectora.jpg','Oraciones.jpg'];
const _caminoPos = ['cp1','cp2','cp3','cp4','cp5','cp6','cp7'];

function htmlCaminito(paradas) {
    const cards = paradas.map((p, i) => `
        <div class="camino-parada ${_caminoPos[i]}" onclick="${p.fn}">
            <img src="imagenes/${_caminoImgs[i]}" alt="${p.nombre}">
        </div>`).join('');
    return `<div class="camino-container">
        <svg class="camino-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="${_caminoPath}" stroke="rgba(0,70,0,0.20)" stroke-width="55" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="${_caminoPath}" stroke="#388e3c" stroke-width="46" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="${_caminoPath}" stroke="#66bb6a" stroke-width="36" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="${_caminoPath}" stroke="#c8e6c9" stroke-width="22" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="${_caminoPath}" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.7" vector-effect="non-scaling-stroke"/>
        </svg>
        ${cards}
    </div>`;
}

/* ─── Feedback modal ─── */
const imgCorrectas = [
    'imagenes/ZorroFeliz.png','imagenes/ZorroCantando.png','imagenes/MonoSorprendido.png',
    'imagenes/JirafaEnamorada.png','imagenes/MonoEnamorado.png','imagenes/JirafaSorprendida.png'
];
const imgIncorrectas = ['imagenes/MonoEnojado.png','imagenes/JirafaTriste.png','imagenes/ZorroPensativo.png'];
let idxCorrecto = 0, idxIncorrecto = 0;

function mostrarFeedback(esCorrecto) {
    const modal = document.getElementById('modalFeedback');
    const img = document.getElementById('feedbackImg');
    const text = document.getElementById('feedbackText');
    const audio = new Audio(esCorrecto ? 'audios/correcto.mp3' : 'audios/incorecto.mp3');
    audio.volume = 1;
    audio.play().catch(()=>{});
    if (esCorrecto) {
        img.src = imgCorrectas[idxCorrecto % imgCorrectas.length];
        idxCorrecto++;
        text.textContent = '¡Muy bien!';
    } else {
        img.src = imgIncorrectas[idxIncorrecto % imgIncorrectas.length];
        idxIncorrecto++;
        text.textContent = 'Intenta otra vez';
    }
    modal.classList.add('mostrar');
    setTimeout(() => { modal.classList.remove('mostrar'); }, 1500);
}

function hablarTexto(texto) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'es-ES';
    voz.rate = 0.75;
    voz.pitch = 1.05;
    window.speechSynthesis.speak(voz);
}

function textoVozLetra(letra, nombre) {
    const nombres = {
        A: 'a',
        B: 'be',
        C: 'ce',
        D: 'de',
        E: 'e',
        F: 'efe',
        G: 'ge',
        H: 'hache',
        I: 'i',
        J: 'jota',
        K: 'ka',
        L: 'ele',
        M: 'eme',
        N: 'ene',
        O: 'o',
        P: 'pe',
        Q: 'cu',
        R: 'erre',
        S: 'ese',
        T: 'te',
        U: 'u',
        V: 'uve',
        W: 'doble uve',
        X: 'equis',
        Y: 'ye',
        Z: 'zeta'
    };
    return nombres[letra] || nombre || letra;
}

function reproducirSonidoLetra(letra, nombre) {
    const audio = new Audio('audios/' + letra + '.mp3');
    let usoVoz = false;

    const usarVoz = () => {
        if (usoVoz) return;
        usoVoz = true;
        hablarTexto(textoVozLetra(letra, nombre));
    };

    audio.onerror = usarVoz;
    audio.play().catch(usarVoz);
}

/* ─── Módulo Palabras A-Z ─── */
const palabrasAZ = [
    {
        "letra":  "A",
        "palabra":  "aguacate",
        "imagen":  "imagenes A-Z/Aguacate.png"
    },
    {
        "letra":  "A",
        "palabra":  "araña",
        "imagen":  "imagenes A-Z/Araña.png"
    },
    {
        "letra":  "A",
        "palabra":  "arbol",
        "imagen":  "imagenes A-Z/Arbol.png"
    },
    {
        "letra":  "A",
        "palabra":  "avion",
        "imagen":  "imagenes A-Z/Avion.png"
    },
    {
        "letra":  "A",
        "palabra":  "azul",
        "imagen":  "imagenes A-Z/Azul.png"
    },
    {
        "letra":  "B",
        "palabra":  "banano",
        "imagen":  "imagenes A-Z/Banano.png"
    },
    {
        "letra":  "B",
        "palabra":  "barco",
        "imagen":  "imagenes A-Z/Barco.png"
    },
    {
        "letra":  "B",
        "palabra":  "bolsa",
        "imagen":  "imagenes A-Z/Bolsa.png"
    },
    {
        "letra":  "B",
        "palabra":  "bota",
        "imagen":  "imagenes A-Z/Bota.png"
    },
    {
        "letra":  "B",
        "palabra":  "burro",
        "imagen":  "imagenes A-Z/Burro.png"
    },
    {
        "letra":  "C",

let letraActualAZ = 0;
let palabraActualAZ = 0;
let grupoActualAZ = 'A';

function abrirPalabrasAZ() {
    document.getElementById('nivel').style.display = 'none';
    document.getElementById('actividad').style.display = 'none';
    document.getElementById('palabrasAZ').style.display = 'block';
    mostrarLetrasAZ();
    document.getElementById('contenedor-palabra-az').innerHTML = '';
    letraActualAZ = 0;
    palabraActualAZ = 0;
}

function irAlAbecedario() {
    document.getElementById('contenedor-letras').innerHTML = '';
    document.getElementById('contenedor-palabra-az').innerHTML = '';
    letraActualAZ = 0;
    palabraActualAZ = 0;
    mostrarLetrasAZ();
}

function volverInicioPalabrasAZ() {
    document.getElementById('palabrasAZ').style.display = 'none';
    letraActualAZ = 0;
    palabraActualAZ = 0;
    window.location.href = 'index.html';
}

function obtenerGruposAZ() {
    const orden = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Ñ','O','P','Q','R','RR','S','T','U','V','W','X','Y','Z'];
    const existentes = new Set(palabrasAZ.map(item => item.letra));
    return orden.filter(letra => letra === 'RR' || existentes.has(letra));
}

function palabrasPorGrupoAZ(grupo) {
    if (grupo === 'RR') {
        const rr = ['perro','zorro','burro','carreta','serrucho'];
        return palabrasAZ.filter(item => rr.includes(item.palabra.toLowerCase()));
    }
    return palabrasAZ.filter(item => item.letra === grupo);
}

function mostrarLetrasAZ() {
    const contenedor = document.getElementById('contenedor-letras');
    document.getElementById('contenedor-palabra-az').innerHTML = '';
    contenedor.innerHTML = obtenerGruposAZ().map(grupo =>
        `<button class="big-btn" style="background:white; color:#e00000; font-size:${grupo === 'RR' ? '44px' : '58px'}; width:130px; height:130px; margin:10px;" onclick="mostrarGrupoAZ('${grupo}')">
            ${grupo}
        </button>`
    ).join('');
}

function mostrarGrupoAZ(grupo) {
    grupoActualAZ = grupo;
    palabraActualAZ = 0;
    mostrarPalabraGrupoAZ();
}

function mostrarPalabraGrupoAZ() {
    const grupos = obtenerGruposAZ();
    const items = palabrasPorGrupoAZ(grupoActualAZ);
    const item = items[palabraActualAZ];

    if (!item) {
        avanzarGrupoAZ();
        return;
    }

    const esUltimaPalabra = palabraActualAZ >= items.length - 1;
    const esUltimoGrupo = grupos.indexOf(grupoActualAZ) >= grupos.length - 1;
    const textoBoton = esUltimaPalabra ? (esUltimoGrupo ? 'Finalizar' : 'Siguiente letra') : 'Siguiente';

    document.getElementById('contenedor-letras').innerHTML = '';
    document.getElementById('contenedor-palabra-az').innerHTML = `

function siguientePalabraAZ() {
    const grupos = obtenerGruposAZ();
    const items = palabrasPorGrupoAZ(grupoActualAZ);
    palabraActualAZ++;

    if (palabraActualAZ >= items.length) {
        const grupoIdx = grupos.indexOf(grupoActualAZ);
        if (grupoIdx >= grupos.length - 1) {
            document.getElementById('contenedor-palabra-az').innerHTML = `
                <h1>&#127881; ¡Palabras terminadas!</h1>
                ${botonRepetirHTML('repetirPalabrasAZ()')}
                <div class="modulo-banda" style="background:#FF9100;margin-top:20px;" onclick="irAlAbecedario()">
                    <span class="banda-emoji">↩️</span>
                    <span class="banda-nombre">Volver a las letras</span>
                    <span class="banda-deco">←</span>
                </div>
            `;
            return;
        }
        grupoActualAZ = grupos[grupoIdx + 1];
        palabraActualAZ = 0;
    }

    mostrarPalabraGrupoAZ();
}

function avanzarGrupoAZ() {
    const grupos = obtenerGruposAZ();
    const grupoIdx = grupos.indexOf(grupoActualAZ);
    grupoActualAZ = grupos[Math.min(grupoIdx + 1, grupos.length - 1)];
    palabraActualAZ = 0;
    mostrarPalabraGrupoAZ();
}

function mostrarPalabraAZ(idx) {
    const item = palabrasAZ[idx];
    grupoActualAZ = item.letra;
    const items = palabrasPorGrupoAZ(grupoActualAZ);
    palabraActualAZ = Math.max(0, items.indexOf(item));
    mostrarPalabraGrupoAZ();
}

}

function elegirLetraSinRepetir(grupo) {
    let disponibles = grupo.filter(l => !letrasUsadas.includes(l.letra));
    if (disponibles.length === 0) {
        letrasUsadas = [];
        disponibles = grupo.slice();
    }
    const elegida = disponibles[Math.floor(Math.random() * disponibles.length)];
    letrasUsadas.push(elegida.letra);
    return elegida;
}

}

function mostrarGeneralizacion() {
    if (!generalizacionActual) return;

    const opciones = generalizacionActual.opciones;
    contenido.innerHTML = `

        <div class="grid" style="max-width:980px; margin:0 auto;">
            ${opciones.map(palabra => `
                <button class="asociacion-card${claseGeneralizacion(palabra)}"
                    style="min-height:76px;"
                    onclick="toggleGeneralizacion('${palabra.replace(/'/g, "\\'")}')">
                    ${palabra}
                </button>
            `).join('')}
        </div>
        <button class="back" style="background:#FF9100; margin-top:12px;" onclick="verificarGeneralizacion()">Verificar</button>
    `;
}

function toggleGeneralizacion(palabra) {
    if (generalizacionSeleccionadas.includes(palabra)) {
        generalizacionSeleccionadas = generalizacionSeleccionadas.filter(p => p !== palabra);
    } else if (generalizacionSeleccionadas.length < 5) {
        generalizacionSeleccionadas.push(palabra);
    }
    mostrarGeneralizacion();
}

function verificarGeneralizacion() {
    const correctas = generalizacionActual.correctas;
    const esCorrecto = generalizacionSeleccionadas.length === 5 &&
        generalizacionSeleccionadas.every(palabra => correctas.includes(palabra));

    if (esCorrecto) {
        puntosLetra++;
        mostrarFeedback(true);
        siguienteLetra();
    } else {
        generalizacionSeleccionadas = [];
        mostrarFeedback(false);
        mostrarGeneralizacion();
    }
}

function verificarLetra(respuesta, correcta) {
    if (respuesta === correcta) {
        puntosLetra++;
        mostrarFeedback(true);
    } else {
        mostrarFeedback(false);
    }
    siguienteLetra();
}

function verificarClasificacion(palabraElegida) {
    if (clasificacionActual && palabraElegida === clasificacionActual.intrusa) {
        puntosLetra++;
        mostrarFeedback(true);
    } else {
        mostrarFeedback(false);
    }
    siguienteLetra();
}

    const musica = document.getElementById('musica-fondo');
    const v = parseInt(val) / 100;
    musica.volume = v;
    musica.muted = (v === 0);
    document.getElementById('vol-pct').textContent = val + '%';
    const btn = document.getElementById('btn-volumen');
    if(v === 0)       btn.textContent = '🔇';
    else if(v < 0.35) btn.textContent = '🔉';
    else              btn.textContent = '🔊';
}
document.addEventListener('click', function(e){
    const ctrl = document.getElementById('control-volumen');
    if(ctrl && !ctrl.contains(e.target)){
        document.getElementById('panel-volumen').classList.remove('abierto');
    }
});

/* ─── Música de fondo ─── */
(function(){
    const musica = document.getElementById('musica-fondo');
    musica.volume = 0.45;
    musica.play().catch(() => {
        ['click','touchstart','keydown'].forEach(ev =>
            document.addEventListener(ev, () => musica.play().catch(()=>{}), { once: true })
        );
    });
})();

/* ─── Inicializar: mostrar menú directamente ─── */
window.addEventListener('DOMContentLoaded', function() {
    document.getElementById('fondo-modulos').style.display = 'block';
    document.getElementById('logo-izq').style.display = 'block';
    document.getElementById('logo-der').style.display = 'block';
    const hash = window.location.hash;
    if (hash === '#palabras') {
        abrirPalabrasAZ();
    } else {
        abrirLetras();
    }
});

</script>
